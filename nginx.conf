# Load balancer (sem lógica de negócio). Limites do compose: nginx 32MB / 0.05 CPU.
# keepalive reduz handshake TCP para api1/api2; buffers pequenos evitam RAM alta.

worker_processes 1;
error_log /dev/null emerg;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    tcp_nodelay on;

    upstream rinhabackend {
        least_conn;
        keepalive 128;
        server api1:8080;
        server api2:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://rinhabackend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # Evitar 502 por aceitar upstream lento (cliente k6 ainda corta ~2s por conta própria)
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Respostas JSON pequenas: menos latência e menos buffer RAM no nginx
            proxy_buffering off;
            proxy_buffers 8 8k;
        }
    }
}
