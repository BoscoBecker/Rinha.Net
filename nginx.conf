# Load balancer (sem lógica de negócio). Limites do compose: nginx 32MB / 0.05 CPU.
# keepalive reduz handshake TCP para api1/api2; buffers pequenos evitam RAM alta.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nodelay on;

    upstream rinhabackend {
        keepalive 32;
        server api1:8080;
        server api2:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://rinhabackend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Respostas JSON pequenas: menos latência e menos buffer RAM no nginx
            proxy_buffering off;
            proxy_buffers 8 8k;
        }
    }
}
