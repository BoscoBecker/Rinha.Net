# Load balancer na frente das APIs (regra Rinha: LB sem lógica de negócio).
# upstream com vários "server": método de balanceamento PADRÃO do nginx = round-robin
# (uma requisição para api1, a seguinte para api2, em ciclo). Sem sticky sessions.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream rinhabackend {
        # Round-robin implícito: ordem cíclica entre api1 e api2.
        keepalive 64;
        server api1:8080;
        server api2:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://rinhabackend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
